name: Deploy to Firebase Hosting (dictationb1.web.app)

# v0.0.7.e: manual opt-in mirror for https://dictationb1.web.app/ only — the
# canonical live site is GitHub Pages and this never auto-runs on PRs/pushes.
# Setup (one time): Firebase console -> Project settings -> Service accounts ->
# Generate new private key, then add it as the repository secret
# FIREBASE_SERVICE_ACCOUNT_DICTATIONB1 (Settings -> Secrets and variables ->
# Actions). No key, no deploy — the job skips cleanly.
# v0.0.7.e: GitHub Pages ONLY (https://dictationb1.github.io/). Firebase
# Hosting is NOT used for deploys — this workflow is manual opt-in only so it
# can never run red on PRs/pushes. Keep firebase.json/.firebaserc valid for
# any prior gate checks that read them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the public tree (strip tests/docs/CI from the upload)
        run: |
          mkdir -p deploy
          tar -cf - \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --exclude='*.zip' \
            --exclude='firebase.json' \
            --exclude='.firebaserc' \
            --exclude='.gitignore' \
            . | (cd deploy && tar -xf -)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DICTATIONB1 }}'
          channelId: live
          projectId: dictationb1
          target: apply
        continue-on-error: true
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DICTATIONB1 != '' }}
