name: Build studio audio pack

on:
  workflow_dispatch:
  push:
    branches: ['arena/3f834891-dictationb1-github-io']
    paths:
      - 'scripts/build-audio.cjs'
      - 'scripts/render-edge.py'
      - '.github/workflows/audio-pack.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'edge-tts==7.3.1'
      - name: Render and verify English and Sinhala neural recordings
        run: node scripts/build-audio.cjs --force
      - uses: actions/upload-artifact@v4
        with:
          name: v44-studio-audio
          path: |
            audio/*.mp3
            scripts/audio-manifest.json
          if-no-files-found: error
          retention-days: 7
