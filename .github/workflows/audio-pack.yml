name: Build studio audio pack

# Manual builds produce an artifact for review; they never push to any branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'edge-tts==7.3.1'
      - name: Render and verify English and Sinhala neural recordings
        run: node scripts/build-audio.cjs --force
      - uses: actions/upload-artifact@v4
        with:
          name: v44-studio-audio
          path: |
            audio/*.mp3
            scripts/audio-manifest.json
          if-no-files-found: error
          retention-days: 7
