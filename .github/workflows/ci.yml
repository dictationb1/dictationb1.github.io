name: Phase 1 validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: node tests/check.cjs
      - run: node --test tests/upgrade.test.cjs
      - run: npm test --prefix tests

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Chromium is the release gate: the CI WebKit build has no H.264 decoder and
    # its renderer is unstable with full-screen video, so it is not a blocker.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tests
      - name: Install the actual browser, not a UA-only substitute
        run: ./tests/node_modules/.bin/playwright-core install --with-deps ${{ matrix.browser }}
      - name: Layout, remote-audio mocks, migration and axe
        run: node tests/upgrade-browser.cjs
        env:
          SDP_BROWSER: ${{ matrix.browser }}
          SDP_BROWSER_STANDARD: '1'
      - name: Full historical Chromium regression
        if: matrix.browser == 'chromium'
        run: |
          mkdir -p tests/artifacts/chromium-libs
          node -e 'const fs=require("fs"),z=require("zlib");fs.writeFileSync("tests/artifacts/al2023.tar",z.brotliDecompressSync(fs.readFileSync("tests/node_modules/@sparticuz/chromium/bin/al2023.tar.br")))'
          tar -xf tests/artifacts/al2023.tar -C tests/artifacts/chromium-libs
          export LD_LIBRARY_PATH="$PWD/tests/artifacts/chromium-libs/lib"
          npm run test:browser --prefix tests
          npm run test:e2e --prefix tests
          node tests/profile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.browser }}
          path: tests/artifacts/
          retention-days: 7
